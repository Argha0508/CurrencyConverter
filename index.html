<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=currency_exchange" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
</head>
<body>
<div class="currencyConverter">
    <h2>Currency Converter</h2>
    <form>
    <div class="amount">
        <p>Enter Amount:</p>
        <input id="amount" type="text" value="1">
    </div>
    <div class="dropdown">
        <div class="from">
            <p>From:</p>
            <div class="select-container">
                 <img class="image" src="https://flagsapi.com/US/flat/64.png" alt="">
                <select name="from" id="">
                
                </select>
            </div>
        </div>
        <span class="material-symbols-outlined">
currency_exchange
</span>
        <div class="to">
            <p>To:</p>  
            <div class="select-container">
                <img class="image" src="https://flagsapi.com/IN/flat/64.png" alt="">
                <select name="to" id="">
                    
                </select>
            </div>
        </div>
    </div>
    <div class="msg">
       
    </div>
    <button id="info">Get Exchange Rate</button>
    </form>
</div>

      <script src="codes.js"></script>
    <script src="index.js"></script>
</body>
</html>
